ServerName localhost
<VirtualHost *:8080>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options FollowSymLinks
        # Le .htaccess OVH peut rediriger vers HTTPS ou la production.
        # Les règles SEF locales sont définies ci-dessous.
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /var/www/html/j6>
        RewriteEngine On
        RewriteBase /j6/
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^api/(?!index\.php(?:/|$)).* api/index.php [L]

        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(?!index\.php(?:/|$)|api/).* index.php [L]
    </Directory>
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    <FilesMatch "(?i)\.(jpa|jps|j[0-9]+|zip|z[0-9]+|sql|log)$">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# Contrôle local des protections du paquet de restauration OVH.
<Directory /var/www/html/ovh-package-check>
    AllowOverride AuthConfig Options
</Directory>
