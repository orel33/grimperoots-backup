ServerName localhost
<VirtualHost *:8080>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options FollowSymLinks
        # Le .htaccess OVH peut rediriger vers HTTPS ou la production.
        # Activer les règles SEF seulement après examen du fichier restauré.
        AllowOverride None
        Require all granted
    </Directory>
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    <FilesMatch "(?i)\.(jpa|jps|j[0-9]+|zip|z[0-9]+|sql|log)$">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# Contrôle local des protections du paquet de restauration OVH.
<Directory /var/www/html/ovh-package-check>
    AllowOverride AuthConfig Options
</Directory>
